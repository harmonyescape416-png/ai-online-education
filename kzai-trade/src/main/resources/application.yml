server:
  port: 18084

spring:
  application:
    name: kzai-trade
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/course_stack_ai?useUnicode=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: kzai
    password: Kzai@2026
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 与课程服务一致：雪花 ID，逻辑删除由实体 @TableLogic 声明
      id-type: assign_id

kzai:
  internal:
    secret: ${KZAI_INTERNAL_SECRET:kzai-dev-internal-secret-only-for-local-run}
  trade:
    # 单笔订单最多可包含的课程数
    max-items: 20
    payment:
      # mock：演示渠道，服务端自签通知后入账。alipay-sandbox：密钥齐全才走支付宝沙箱，否则支付宝选择仍是模拟。
      provider: ${KZAI_PAYMENT_PROVIDER:mock}
      mock-secret: ${KZAI_MOCK_PAY_SECRET:kzai-dev-mock-pay-secret}
      merchant-id: ${KZAI_MOCK_MERCHANT_ID:kzai-mock-merchant}
      expire-minutes: 30
      alipay:
        app-id: ${ALIPAY_SANDBOX_APP_ID:}
        private-key: ${ALIPAY_SANDBOX_PRIVATE_KEY:}
        alipay-public-key: ${ALIPAY_SANDBOX_PUBLIC_KEY:}
        gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
        notify-url: ${ALIPAY_SANDBOX_NOTIFY_URL:}
